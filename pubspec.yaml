name: force_graph
description: "Forge2D based force directed graph with multiple graph layout algorithms (MDS, Spring Embedder, Distance based) and realistic physics."
version: 0.6.0
repository: https://github.com/flrnsbt/force_graph
homepage: https://pub.dev/packages/force_graph
documentation: https://raw.githubusercontent.com/flrnsbt/force_graph/refs/heads/main/README.md
topics: 
  - graph
  - forge2d
  - force-directed-graph

environment:
  sdk: ^3.8.1
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  forge2d: ^0.14.2+1
  isolate_manager: ^6.3.2

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  isolate_manager_generator: ^0.0.13


flutter:
  assets: 
    - web/performSpringEmbedderLayoutIsolate.js
    - web/performDistanceLayoutIsolate.js